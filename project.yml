name: GezGorYe
options:
  bundleIdPrefix: com.serdar
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.10'
  MARKETING_VERSION: '1.0'
  CURRENT_PROJECT_VERSION: '1'
targets:
  GezGorYe:
    type: application
    platform: iOS
    sources:
      - path: GezGorYe
    resources:
      - path: GezGorYe/Resources
    info:
      path: GezGorYe/Support/Info.plist
      properties:
        CFBundleDisplayName: GezGörYe
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.serdar.GezGorYe
      TARGETED_DEVICE_FAMILY: '1,2'
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.travel
    scheme:
      testTargets:
        - GezGorYeTests

  GezGorYeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GezGorYeTests
    dependencies:
      - target: GezGorYe
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.serdar.GezGorYeTests
      GENERATE_INFOPLIST_FILE: YES
